<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/style.css">
    <title>ثبت درخواست اجاره | دارینو</title>
</head>
<body>

    <header>
        <div class="logo">
            <h1>دارینو</h1>
            <span>بازارگاه آنلاین اجاره کالا</span>
        </div>

        <nav>
            <a href="../../index.html">صفحه اصلی</a>
            <a href="products.html">کالاها</a>
            <a href="analysis.html">پرونده تحلیلی</a>
        </nav>
    </header>

    <main>

        <section class="categories">

            <div class="section-title">
                <span>ثبت درخواست اجاره</span>
                <h2>درخواست خود را ثبت کن</h2>
                <p>
                    اطلاعات زیر برای شبیه‌سازی فرآیند اجاره در MVP دارینو است.
                </p>
            </div>

            <div class="rental-form">

                <label for="product">کالای موردنظر</label>

                <select id="product">
                    <option value="camera">دوربین Canon EOS 250D</option>
                    <option value="microphone">میکروفون Rode</option>
                    <option value="tent">چادر دو نفره</option>
                    <option value="drill">دریل شارژی</option>
                    <option value="light">کیت نورپردازی</option>
                    <option value="backpack">کوله‌پشتی کوهنوردی</option>
                </select>

                <label for="name">نام و نام خانوادگی</label>

                <input id="name" type="text" placeholder="مثلاً نازنین دهقان">

                <label for="phone">شماره تماس</label>

                <input id="phone" type="tel" placeholder="مثلاً 09120000000">

                <label for="start-date">تاریخ شروع اجاره</label>

                <input id="start-date" type="date">

                <label for="days">مدت اجاره</label>

                <select id="days">
                    <option value="1">۱ روز</option>
                    <option value="2">۲ روز</option>
                    <option value="3">۳ روز</option>
                    <option value="5">۵ روز</option>
                    <option value="7">۷ روز</option>
                </select>

                <button onclick="submitRental()">ثبت درخواست اجاره</button>

                <div id="result"></div>

            </div>

        </section>

    </main>

    <footer>
        <div>
            <h3>دارینو</h3>
            <p>هوشمندانه اجاره کن، به‌صرفه استفاده کن.</p>
        </div>

        <div>
            <p>نسخه MVP</p>
            <p>پرداخت در این نسخه شبیه‌سازی شده است.</p>
        </div>

        <p>تمام حقوق این سامانه محفوظ است.</p>
    </footer>

    <script>
        function submitRental() {
            const product = document.getElementById("product").value;
            const name = document.getElementById("name").value;
            const phone = document.getElementById("phone").value;
            const startDate = document.getElementById("start-date").value;
            const days = document.getElementById("days").value;
            const result = document.getElementById("result");

            if (!name || !phone || !startDate) {
                result.innerHTML = "لطفاً اطلاعات موردنیاز را کامل کنید.";
                return;
            }

            result.innerHTML = `
                <div class="success-message">
                    <h3>درخواست شما ثبت شد ✓</h3>
                    <p>کالای انتخابی: ${product}</p>
                    <p>نام متقاضی: ${name}</p>
                    <p>مدت اجاره: ${days} روز</p>
                    <p>وضعیت درخواست: در انتظار تأیید مالک</p>
                </div>
            `;
        }
    </script>

</body>
</html>
